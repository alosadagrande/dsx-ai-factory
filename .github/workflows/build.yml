#
# Runs on every pull request.
# - Builds container images for changed components (does not push)
# - Lints and dry-runs all Helm charts

name: Build

on:
  pull_request:
    branches:
      - main
      - '[0-9][0-9].[0-9][0-9]'

jobs:
  # ---------------------------------------------------------------------------
  # Helm lint
  # ---------------------------------------------------------------------------
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and dry-run charts
        run: |
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            echo "==> helm lint $chart"
            helm dependency build "$chart" 2>/dev/null || true
            helm lint "$chart"
            echo "==> helm template $chart"
            helm template release "$chart" > /dev/null
          done

  # ---------------------------------------------------------------------------
  # Container image build (no push)
  # ---------------------------------------------------------------------------
  build-images:
    runs-on: ubuntu-latest
    # TODO: define matrix over components once Dockerfiles exist under docker/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (no push)
        run: |
          echo "No Dockerfiles yet — add build matrix entries as components are added."

  # ---------------------------------------------------------------------------
  # Hugo docs build check
  # ---------------------------------------------------------------------------
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build docs
        run: hugo --source docs/ --minify
