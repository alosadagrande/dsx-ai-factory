#
# Runs on push to a YY.MM release branch or a vYY.MM.* tag.
# - Publishes container images to GHCR
# - Publishes Helm charts to GHCR (OCI)
# - Deploys Hugo docs to GitHub Pages

name: Release

on:
  push:
    branches:
      - '[0-9][0-9].[0-9][0-9]'
    tags:
      - 'v[0-9][0-9].[0-9][0-9].*'

env:
  IMAGE_REGISTRY: ghcr.io/rh-ecosystem-edge/dsx-ai-factory
  CHART_REGISTRY: oci://ghcr.io/rh-ecosystem-edge/dsx-ai-factory/charts

jobs:
  # ---------------------------------------------------------------------------
  # Publish container images
  # ---------------------------------------------------------------------------
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # TODO: define matrix over components once Dockerfiles exist under docker/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish images
        run: |
          echo "No Dockerfiles yet — add build/push steps as components are added."

  # ---------------------------------------------------------------------------
  # Publish Helm charts
  # ---------------------------------------------------------------------------
  publish-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
                --username ${{ github.actor }} \
                --password-stdin

      - name: Package and push charts
        run: |
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm dependency build "$chart" 2>/dev/null || true
            pkg=$(helm package "$chart" --destination /tmp/charts/ | awk '{print $NF}')
            helm push "$pkg" "$CHART_REGISTRY"
          done

  # ---------------------------------------------------------------------------
  # Deploy Hugo docs to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build docs
        run: hugo --source docs/ --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
