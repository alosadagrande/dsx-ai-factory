<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 680" width="100%" height="100%" style="background:#ffffff; font-family:'Red Hat Text', 'Red Hat Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Card Drop Shadow -->
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="pill-shadow" x="-5%" y="-10%" width="110%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.09"/>
    </filter>
    
    <!-- Marker Arrows -->
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#EE0000" />
    </marker>
    <marker id="arrow-charcoal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#212427" />
    </marker>
  </defs>

  <!-- Title / Legend Bar -->
  <g id="rh-header">
    <rect x="30" y="24" width="880" height="42" rx="4" fill="#151515"/>
    <rect x="30" y="24" width="6" height="42" rx="2" fill="#EE0000"/>
    <text x="48" y="50" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="0.6">REFERENCE ARCHITECTURE | INFRASTRUCTURE AUTOMATION</text>
  </g>

  <!-- CONTAINER 1: Management Cluster -->
  <g id="management-cluster" transform="translate(30, 86)">
    <!-- Main Box -->
    <rect width="880" height="236" rx="8" fill="#F8F9FA" stroke="#D2D2D2" stroke-width="1.5"/>
    <!-- Header Ribbon -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 872 0 A 8 8 0 0 1 880 8 L 880 38 L 0 38 Z" fill="#EE0000" />
    <text x="24" y="24" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="0.5">MANAGEMENT CLUSTER</text>
    <text x="856" y="24" fill="#FFFFFF" font-size="12" font-weight="400" text-anchor="end" opacity="0.9">Control Plane Domain</text>

    <!-- Sub-Card 1: NICo (Infra Controller) -->
    <g transform="translate(35, 54)" filter="url(#card-shadow)">
      <rect width="385" height="162" rx="6" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1.2"/>
      <rect x="0" y="0" width="385" height="40" rx="6" fill="#F0F4F8"/>
      <rect x="0" y="37" width="385" height="3" fill="#EE0000"/>
      <text x="18" y="25" fill="#151515" font-size="14" font-weight="700">NICo <tspan font-weight="400" fill="#4F5255">(Infra Controller)</tspan></text>

      <!-- Bullet points -->
      <circle cx="28" cy="65" r="3.5" fill="#EE0000"/>
      <text x="40" y="69" fill="#151515" font-size="13" font-weight="500">Bare-metal provisioning</text>

      <circle cx="28" cy="98" r="3.5" fill="#EE0000"/>
      <text x="40" y="102" fill="#151515" font-size="13" font-weight="500">ZTP / DHCP</text>

      <circle cx="28" cy="131" r="3.5" fill="#EE0000"/>
      <text x="40" y="135" fill="#151515" font-size="13" font-weight="500">Machine validation</text>
    </g>

    <!-- Sub-Card 2: RMS (Rack Management Service) -->
    <g transform="translate(460, 54)" filter="url(#card-shadow)">
      <rect width="385" height="162" rx="6" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1.2"/>
      <rect x="0" y="0" width="385" height="40" rx="6" fill="#F0F4F8"/>
      <rect x="0" y="37" width="385" height="3" fill="#151515"/>
      <text x="18" y="25" fill="#151515" font-size="14" font-weight="700">RMS <tspan font-weight="400" fill="#4F5255">(Rack Management Service)</tspan></text>

      <!-- Bullet points -->
      <circle cx="28" cy="63" r="3.5" fill="#151515"/>
      <text x="40" y="67" fill="#151515" font-size="13" font-weight="500">Switch fabric config</text>

      <circle cx="28" cy="90" r="3.5" fill="#151515"/>
      <text x="40" y="94" fill="#151515" font-size="13" font-weight="500">Firmware updates</text>

      <circle cx="28" cy="117" r="3.5" fill="#151515"/>
      <text x="40" y="121" fill="#151515" font-size="13" font-weight="500">Power management</text>

      <circle cx="28" cy="144" r="3.5" fill="#151515"/>
      <text x="40" y="148" fill="#151515" font-size="13" font-weight="500">Hardware inventory</text>
    </g>
  </g>

  <!-- INTERCONNECTS / CHANNELS -->
  <!-- Left Path: NICo -> Provisioning Network -> GPU/DPU Nodes -->
  <g id="path-provisioning">
    <line x1="227" y1="322" x2="227" y2="475" stroke="#EE0000" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
    
    <!-- Protocol Badge -->
    <g transform="translate(137, 355)" filter="url(#pill-shadow)">
      <rect width="180" height="28" rx="14" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.5"/>
      <text x="90" y="18" fill="#EE0000" font-size="11.5" font-weight="700" text-anchor="middle">Redfish / iPXE</text>
    </g>
    <!-- Network Label Pill -->
    <g transform="translate(127, 398)" filter="url(#pill-shadow)">
      <rect width="200" height="26" rx="4" fill="#FDF2F2" stroke="#F8B4B4" stroke-width="1"/>
      <text x="100" y="17" fill="#A30000" font-size="11" font-weight="600" text-anchor="middle">Provisioning network</text>
    </g>
  </g>

  <!-- Right Path: RMS -> Management Network -> Spectrum-X Switches -->
  <g id="path-management">
    <line x1="652" y1="322" x2="652" y2="475" stroke="#212427" stroke-width="2.5" marker-end="url(#arrow-charcoal)"/>

    <!-- Protocol Badge -->
    <g transform="translate(562, 355)" filter="url(#pill-shadow)">
      <rect width="180" height="28" rx="14" fill="#FFFFFF" stroke="#212427" stroke-width="1.5"/>
      <text x="90" y="18" fill="#212427" font-size="11.5" font-weight="700" text-anchor="middle">NVUE / Redfish</text>
    </g>
    <!-- Network Label Pill -->
    <g transform="translate(552, 398)" filter="url(#pill-shadow)">
      <rect width="200" height="26" rx="4" fill="#F0F4F8" stroke="#C5D3E0" stroke-width="1"/>
      <text x="100" y="17" fill="#004080" font-size="11" font-weight="600" text-anchor="middle">Management network</text>
    </g>
  </g>

  <!-- CONTAINER 2: DSX AI Factory Nodes -->
  <g id="dsx-factory-nodes" transform="translate(30, 480)">
    <!-- Main Box -->
    <rect width="880" height="165" rx="8" fill="#F8F9FA" stroke="#D2D2D2" stroke-width="1.5"/>
    <!-- Header Ribbon -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 872 0 A 8 8 0 0 1 880 8 L 880 38 L 0 38 Z" fill="#151515" />
    <text x="24" y="24" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="0.5">DSX AI FACTORY NODES</text>
    <text x="856" y="24" fill="#A2A9B0" font-size="12" font-weight="400" text-anchor="end">Target Infrastructure Fabric</text>

    <!-- Node 1: NVIDIA GPU / DPU Nodes -->
    <g transform="translate(35, 52)" filter="url(#card-shadow)">
      <rect width="385" height="92" rx="6" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#EE0000"/>
      <text x="20" y="32" fill="#151515" font-size="14" font-weight="700">NVIDIA GPU / DPU Nodes</text>
      <!-- Sub-label Badge -->
      <g transform="translate(20, 48)">
        <rect width="220" height="24" rx="4" fill="#FDF2F2" stroke="#F8B4B4" stroke-width="1"/>
        <text x="110" y="16.5" fill="#C51B24" font-size="11.5" font-weight="600" text-anchor="middle">bare-metal, RHEL / OCP</text>
      </g>
    </g>

    <!-- Node 2: NVIDIA Spectrum-X Switches -->
    <g transform="translate(460, 52)" filter="url(#card-shadow)">
      <rect width="385" height="92" rx="6" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#0066CC"/>
      <text x="20" y="32" fill="#151515" font-size="14" font-weight="700">NVIDIA Spectrum-X Switches</text>
      <!-- Sub-label Badge -->
      <g transform="translate(20, 48)">
        <rect width="130" height="24" rx="4" fill="#F0F4F8" stroke="#C5D3E0" stroke-width="1"/>
        <text x="65" y="16.5" fill="#004080" font-size="11.5" font-weight="600" text-anchor="middle">network fabric</text>
      </g>
    </g>
  </g>
</svg>

