#
# Red Hat overrides for the upstream nico and rack-manager charts.
# Only image registries and tags are overridden here; all other defaults
# come from the upstream charts unmodified.
#
# Image tags are pinned by release.yml via sed before helm package.
# Deploy into the nico-system namespace:
#
#   helm install dsx-ai-factory oci://ghcr.io/.../dsx-ai-factory \
#     --namespace nico-system --create-namespace

# ---------------------------------------------------------------------------
# NICo core services
# ---------------------------------------------------------------------------
nico:
  global:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/infra-controller-core
      tag: latest   # replaced by release.yml: infra-controller-core:.*
      pullPolicy: IfNotPresent

  unbound:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/unbound
      tag: latest   # replaced by release.yml: unbound:.*

  nico-ntp:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/infra-controller-ntp
      tag: latest   # replaced by release.yml: infra-controller-ntp:.*

# ---------------------------------------------------------------------------
# NICo REST services
# ---------------------------------------------------------------------------
nico-rest:
  nico-rest-api:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/infra-controller-rest-api
      tag: latest   # replaced by release.yml: infra-controller-rest-api:.*

  nico-rest-cert-manager:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/infra-controller-rest-cert-manager
      tag: latest   # replaced by release.yml: infra-controller-rest-cert-manager:.*

  nico-rest-db:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/infra-controller-rest-db
      tag: latest   # replaced by release.yml: infra-controller-rest-db:.*

  nico-rest-site-agent:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/infra-controller-rest-site-agent
      tag: latest   # replaced by release.yml: infra-controller-rest-site-agent:.*

  nico-rest-site-manager:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/infra-controller-rest-site-manager
      tag: latest   # replaced by release.yml: infra-controller-rest-site-manager:.*

  nico-rest-workflow:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/infra-controller-rest-workflow
      tag: latest   # replaced by release.yml: infra-controller-rest-workflow:.*

# ---------------------------------------------------------------------------
# RMS
# ---------------------------------------------------------------------------
rack-manager:
  global:
    image:
      tag: latest   # replaced by release.yml: nv-rms:.*
      pullPolicy: IfNotPresent

  apiServer:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/nv-rms
